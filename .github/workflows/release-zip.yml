name: Upload Custom Zip to Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  upload-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create ZIP archive
        # This zips the repository contents, excluding git and GitHub Action files
        run: |
          zip -r V5-Mojmap.zip . -x "*.git*" ".github/*"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: V5-Mojmap.zip
